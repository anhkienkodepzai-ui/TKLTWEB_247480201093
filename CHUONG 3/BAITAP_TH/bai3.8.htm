      .menu {
        width: 800px;
        margin: 30px auto;
        background-color: #333;
        list-style: none;
        display: flex;
      }

      .menu > li {
        position: relative;
      }

      .menu > li > a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 15px 20px;
      }

      .menu > li > a:hover {
        background-color: #555;
      }

      /* Menu con */
      .submenu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 270px;
        background-color: #444;
        list-style: none;
      }

      /* Hiện menu con khi rê chuột */
      .dropdown:hover .submenu {
        display: block;
      }

      .submenu li {
        position: relative;
      }

      .submenu li a {
        display: block;
        padding: 10px;
        color: white;
        text-decoration: none;
        border-bottom: 1px solid #666;
      }

      .submenu li a:hover {
        background-color: #666;
      }

      /* Menu cấp 2 bên phải */
      .submenu-right {
        display: none;
        position: absolute;
        top: 0;
        left: 100%;
        width: 250px;
        background-color: #555;
        list-style: none;
      }

      /* Hiện menu cấp 2 */
      .submenu li:hover .submenu-right {
        display: block;
      }
    </style>
