<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký xét tuyển</title>
  </head>

  <body>
    <table border="2" width="800" align="center">
      <!-- TIÊU ĐỀ KHUNG -->
      <tr>
        <td bgcolor="grey">
          <b>Đăng ký dự thi</b>
        </td>
      </tr>

      <tr>
        <td>
          <!-- PHẦN ĐẦU -->
          <table width="100%">
            <tr>
              <td width="50%">
                <b>TRƯỜNG ĐẠI HỌC BẠC LIÊU</b><br />
                KHOA KỸ THUẬT VÀ CÔNG NGHỆ
              </td>

              <td width="50%" align="center">
                <b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><br />
                Độc lập - Tự do - Hạnh phúc
              </td>
            </tr>
          </table>

          <br />

          <!-- TIÊU ĐỀ -->
          <center>
            <font face="Verdana" size="5">
              <b>ĐĂNG KÝ XÉT TUYỂN</b>
            </font>
          </center>

          <br /><br />

          <!-- FORM -->
          <form>
            <table align="center">
              <!-- HỌ TÊN -->
              <tr>
                <td>Họ tên:</td>

                <td>
                  <input type="text" name="hoten" size="25" />
                </td>
              </tr>

              <!-- GIỚI TÍNH -->
              <tr>
                <td>Giới tính:</td>

                <td>
                  <input type="radio" name="gioitinh" value="Nam" checked /> Nam
                  &nbsp;&nbsp;&nbsp;

                  <input type="radio" name="gioitinh" value="Nu" />
                  Nữ
                </td>
              </tr>

              <!-- NGÀNH THI -->
              <tr>
                <td valign="top">Ngành thi:</td>

                <td>
                  <input type="radio" name="nganh" value="CNTT" checked />
                  Công nghệ thông tin
                  <br />

                  <input type="radio" name="nganh" value="MamNon" />
                  Mầm non
                  <br />

                  <input type="radio" name="nganh" value="AmNhac" />
                  Âm nhạc
                </td>
              </tr>

              <tr>
                <td></td>

                <td>
                  <br />

                  <input type="submit" value="Đồng ý" />

                  &nbsp;&nbsp;&nbsp;

                  <input type="reset" value="Không đồng ý" />
                </td>
              </tr>
            </table>
          </form>
        </td>
      </tr>
    </table>
  </body>
</html>
