<html>
  <head>
    <title>Bài tập JavaScript 1B</title>
  </head>

  <body>
    <script language="JavaScript">

var HoTen, Lop;

HoTen = prompt("Bạn hãy nhập vào Họ tên sinh viên:", "");
Lop = prompt("Bạn hãy nhập vào Lớp:", "");

document.write("<H1><font color='red'>TRƯỜNG ĐẠI HỌC BẠC LIÊU</font></H1>");

document.write("<H2><font color='blue'>KHOA CÔNG NGHỆ THÔNG TIN</font></H2>");

document.write("<font size='14' color='black'><b>Lớp học: "
+ Lop + "</b></font><br>");

document.write("<font size='14' color='green'><b>Họ tên sinh viên: "
+ HoTen + "</b></font>");

</script>
    </script>
  </body>
</html>
