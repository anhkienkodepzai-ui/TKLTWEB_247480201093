<html>
  <head>
    <title>Bài làm Javascript 05B</title>
  </head>

  <body>
    <script language="JavaScript">
      var D = new Date();

      var Ngay = D.getDate();
      var Thang = D.getMonth() + 1;
      var Nam = D.getFullYear();

      document.write("Hôm nay là ngày " + Ngay + "/" + Thang + "/" + Nam);
    </script>
  </body>
</html>
