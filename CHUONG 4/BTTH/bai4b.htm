<html>
  <head>
    <title>Bài làm Javascript 04B</title>
  </head>

  <body>
    <script language="JavaScript">
      function cthoten() {
        alert(txthoten.value);
      }

      function ctdonvi() {
        alert(txtdonvi.value);
      }
    </script>

    <input type="button" name="hoten" value="Họ tên" onclick="cthoten()" />

    <input type="button" name="donvi" value="Đơn vị" onclick="ctdonvi()" />

    <br /><br />

    <input type="text" name="txthoten" id="txthoten" value="Chào" size="40" />

    <br /><br />

    <input type="text" name="txtdonvi" id="txtdonvi" value="Đơn vị" size="40" />
  </body>
</html>
