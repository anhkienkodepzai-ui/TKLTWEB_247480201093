<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Đăng ký</title>
  </head>

  <body>
    <form method="POST" action="">
      <font face="Arial" size="2">
        <b>Tên tài khoản</b>
      </font>
      <br />

      <input type="text" name="username" size="25" maxlength="20" />

      <br /><br />

      <font face="Arial" size="2">
        <b>Mật khẩu</b>
      </font>
      <br />

      <input type="password" name="password" size="25" maxlength="20" />

      <br /><br />

      <font face="Arial" size="2">
        <b>Giới tính:</b>
      </font>

      <input type="radio" name="sex" value="Male" />
      <font face="Arial" size="2">Nam</font>

      <input type="radio" name="sex" value="Female" />
      <font face="Arial" size="2">Nữ</font>

      <br /><br />

      <font face="Arial" size="2">
        <b>Học lực:</b>
      </font>

      <select name="education" size="1">
        <option value="Invalid">Chọn mức học lực</option>

        <option value="HSchool">Trung Học</option>

        <option value="College">Cao Đẳng</option>

        <option value="University">Đại Học</option>
      </select>

      <br /><br />

      <font face="Arial" size="2">
        <b>Sở thích:</b>
      </font>

      <br />

      <input type="checkbox" name="Books" value="1" />
      <font face="Arial" size="2"> Đọc sách </font>

      <br />

      <input type="checkbox" name="Music" value="2" />
      <font face="Arial" size="2"> Nghe nhạc </font>

      <br />

      <input type="checkbox" name="Movies" value="3" />
      <font face="Arial" size="2"> Xem phim </font>

      <br />

      <input type="checkbox" name="Cooking" value="4" />
      <font face="Arial" size="2"> Nấu ăn </font>

      <br /><br />

      <input type="submit" name="submit" value="Đăng Ký" />

      <input type="reset" value="Hủy" />
    </form>
  </body>
</html>
